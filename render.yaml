services:
  # 1. Frontend
  - type: web
    name: fortcode-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: fortcode-backend
          type: web
          property: host

  # 2. Main Backend (Node.js)
  - type: web
    name: fortcode-backend
    runtime: node
    rootDir: Back
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false 
      - key: JWT_SECRET
        sync: false 
      - key: ML_DETECTION_URL
        fromService:
          name: ml-detection
          type: web
          property: host
      - key: COMPLEXITY_SERVICE_URL
        fromService:
          name: complexity-service
          type: web
          property: host
      - key: AI_SERVICE_URL
        fromService:
          name: ai-service
          type: web
          property: host

  # 3. ML Detection Service
  - type: web
    name: ml-detection
    runtime: python
    rootDir: ml-service-python
    buildCommand: pip install -r requirements.txt
    startCommand: python api.py

  # 4. Complexity Service
  - type: web
    name: complexity-service
    runtime: python
    rootDir: complexity-service
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py

  # 5. AI Service
  - type: web
    name: ai-service
    runtime: python
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
